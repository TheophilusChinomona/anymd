server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /etc/nginx/playground-csp.conf;

    location = / { return 302 /playground; }
    location = /health { default_type text/plain; return 200 'ok\n'; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    location /assets/ { expires 1d; try_files $uri =404; }
    location /wasm/ { expires 1h; try_files $uri =404; }
}
